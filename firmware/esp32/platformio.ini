[env:philo]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps =
    adafruit/Adafruit MPU6050 @ ^2.2.6
    adafruit/Adafruit SSD1306 @ ^2.5.7
    adafruit/Adafruit GFX Library @ ^1.11.9
    adafruit/Adafruit BusIO @ ^1.14.5

; Bench builds for DRV8833 driver boards (no PWM pin; PWM on IN pins).
; Commands come over the USB cable (type "CMD 120 120 0" in the serial monitor,
; or run vision/rpi/main.py --serial <port> from a laptop).
; philo_drv8833        : motors only, ultrasonic safety disabled (nothing wired yet)
; philo_drv8833_sensors: same, with the 3 ultrasonic sensors wired and active
[env:philo_drv8833]
extends = env:philo
build_flags = -DDRV8833 -DPI_OVER_USB -DNO_ULTRASONIC

[env:philo_drv8833_sensors]
extends = env:philo
build_flags = -DDRV8833 -DPI_OVER_USB
