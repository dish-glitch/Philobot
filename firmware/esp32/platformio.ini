[env:philo]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps =
    adafruit/Adafruit MPU6050 @ ^2.2.6
    adafruit/Adafruit SSD1306 @ ^2.5.7
    adafruit/Adafruit GFX Library @ ^1.11.9
    adafruit/Adafruit BusIO @ ^1.14.5

; Bench build for DRV8833 driver boards (no PWM pin; PWM on IN pins). See ../README.md
[env:philo_drv8833]
extends = env:philo
build_flags = -DDRV8833
